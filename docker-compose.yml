services:
  postgres:
    image: postgres:16-alpine
    container_name: syswiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: syswiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
      POSTGRES_DB: syswiki
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - syswiki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syswiki -d syswiki"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  syswiki_pgdata:
