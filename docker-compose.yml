services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syswiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiá_esta_clave}
      POSTGRES_DB: syswiki
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syswiki"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
