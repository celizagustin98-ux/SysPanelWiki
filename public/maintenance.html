<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mantenimiento · SysIntranet</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0b1220; --fg: #e8eef7; --muted: #94a3b8; --card: #121a2b;
        --border: rgba(148, 163, 184, 0.16); --primary: #14b8a6; --primary-fg: #042f2e;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f7fb; --fg: #0f172a; --muted: #64748b; --card: #ffffff;
          --border: rgba(15, 23, 42, 0.1);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background:
          radial-gradient(900px circle at 12% -10%, rgba(20, 184, 166, 0.14), transparent 50%),
          radial-gradient(700px circle at 100% 0%, rgba(20, 184, 166, 0.08), transparent 45%),
          var(--bg);
        color: var(--fg);
      }
      .card {
        width: 100%; max-width: 28rem; text-align: center; padding: 2rem 1.5rem 1.75rem;
        border-radius: 1.1rem; border: 1px solid var(--border);
        background: color-mix(in srgb, var(--card) 92%, transparent);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22); backdrop-filter: blur(12px);
      }
      .brand {
        display: inline-flex; align-items: center; gap: 0.55rem; margin-bottom: 0.75rem;
        color: var(--muted); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;
      }
      .brand-mark {
        width: 1.6rem; height: 1.6rem; border-radius: 0.45rem; background: var(--primary); color: var(--primary-fg);
        display: grid; place-items: center; font-size: 0.75rem; font-weight: 800;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.35rem; letter-spacing: -0.02em; font-weight: 650; }
      p { margin: 0 0 1.35rem; color: var(--muted); font-size: 0.95rem; }
      button {
        appearance: none; border: 0; border-radius: 0.65rem; padding: 0.6rem 1.05rem;
        font: inherit; font-weight: 600; cursor: pointer; background: var(--primary); color: var(--primary-fg);
      }
      button:hover { filter: brightness(1.05); }
      .code { margin-top: 1.25rem; font-size: 0.72rem; color: var(--muted); opacity: 0.7; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand"><span class="brand-mark">SI</span> SysIntranet</div>
      <h1>Mantenimiento en curso</h1>
      <p>Estamos actualizando SysIntranet. El servicio vuelve en breve.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <div class="code">HTTP 503</div>
    </div>
  </body>
</html>
